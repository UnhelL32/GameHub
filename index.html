                            <div className="grid grid-cols-2 gap-2 text-xs">
                                <div className="space-y-1">
                                    <label className="text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-slate-500 block">Start Date</label>
                                    <input 
                                        type="date" 
                                        value={startDate}
                                        onChange={(e) => onUpdate(game.id, 'startDate', e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 sm:px-2.5 sm:py-1.5 text-[11px] sm:text-xs text-slate-300 focus:border-indigo-500 focus:outline-none"
                                    />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-slate-500 block">End Date</label>
                                    <input 
                                        type="date" 
                                        value={endDate}
                                        onChange={(e) => onUpdate(game.id, 'endDate', e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 sm:px-2.5 sm:py-1.5 text-[11px] sm:text-xs text-slate-300 focus:border-indigo-500 focus:outline-none"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [trackerState, setTrackerState] = useState(() => {
                try {
                    const saved = localStorage.getItem('gameTracker_hardcoded');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) { return {}; }
            });

            const [selectedGenre, setSelectedGenre] = useState('All');
            const [searchKeyword, setSearchKeyword] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');

            useEffect(() => {
                localStorage.setItem('gameTracker_hardcoded', JSON.stringify(trackerState));
            }, [trackerState]);

            const handleUpdate = (id, key, val) => {
                setTrackerState(prev => ({ ...prev, [id]: { ...prev[id], [key]: val } }));
            };

            const genres = ['All', 'RPG', 'FPS', 'Third-Person', 'RTS'];

            const filteredGames = useMemo(() => {
                return gamesDB.filter(game => {
                    const matchesGenre = selectedGenre === 'All' || game.genre === selectedGenre;
                    const matchesSearch = game.title.toLowerCase().includes(searchKeyword.toLowerCase());
                    const isPlayed = trackerState[game.id]?.played || false;
                    const matchesStatus = statusFilter === 'All' ? true : statusFilter === 'Played' ? isPlayed : !isPlayed;

                    return matchesGenre && matchesSearch && matchesStatus;
                });
            }, [selectedGenre, searchKeyword, statusFilter, trackerState]);

            const completedCount = Object.values(trackerState).filter(g => g?.played).length;
            const progressPercent = Math.round((completedCount / gamesDB.length) * 100);

            return (
                <div className="min-h-screen flex flex-col bg-slate-950">
                    <header className="sticky top-0 z-30 bg-slate-950/85 backdrop-blur-md border-b border-slate-800 py-3 sm:py-5">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between gap-3">
                                <div>
                                    <h1 className="text-xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 tracking-tight">
                                        Backlog Vault
                                    </h1>
                                    <p className="text-[11px] sm:text-xs text-slate-400 mt-0.5">Top 80 Video Games Collection</p>
                                </div>

                                <div className="flex items-center gap-2.5 sm:gap-3 bg-slate-900 border border-slate-800 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl sm:rounded-2xl shadow-inner">
                                    <div className="text-right">
                                        <div className="text-[9px] sm:text-[10px] font-bold text-slate-400 uppercase tracking-wider">Progress</div>
                                        <div className="text-xs sm:text-base font-black text-indigo-400">
                                            {completedCount} <span className="text-[10px] sm:text-xs font-normal text-slate-500">/ {gamesDB.length}</span>
                                        </div>
                                    </div>
                                    <div className="w-12 sm:w-20 bg-slate-800 h-1.5 sm:h-2 rounded-full overflow-hidden hidden sm:block">
                                        <div className="bg-gradient-to-r from-indigo-500 to-emerald-400 h-full transition-all duration-300" style={{ width: `${progressPercent}%` }}></div>
                                    </div>
                                    <span className="text-[10px] sm:text-xs font-bold text-emerald-400">{progressPercent}%</span>
                                </div>
                            </div>
                            
                            <div className="mt-3 sm:mt-5 flex flex-col sm:flex-row gap-2.5 sm:gap-4 sm:items-center sm:justify-between">
                                <div className="flex gap-1.5 overflow-x-auto pb-1.5 sm:pb-0 no-scrollbar -mx-4 px-4 sm:mx-0 sm:px-0">
                                    {genres.map(genre => (
                                        <button 
                                            key={genre}
                                            onClick={() => setSelectedGenre(genre)}
                                            className={`px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-lg sm:rounded-xl text-[11px] sm:text-xs font-bold transition-all whitespace-nowrap flex-shrink-0 ${
                                                selectedGenre === genre ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800/80'
                                            }`}
                                        >
                                            {genre}
                                        </button>
                                    ))}
                                </div>

                                <div className="flex items-center gap-2 w-full sm:w-auto">
                                    <select 
                                        value={statusFilter}
                                        onChange={(e) => setStatusFilter(e.target.value)}
                                        className="bg-slate-900 border border-slate-800 text-[11px] sm:text-xs text-slate-300 font-medium rounded-lg sm:rounded-xl px-2.5 py-1.5 sm:py-2 focus:outline-none focus:border-indigo-500"
                                    >
                                        <option value="All">All Status</option>
                                        <option value="Played">Played</option>
                                        <option value="Unplayed">Unplayed</option>
                                    </select>
                                    <div className="relative flex-1 sm:w-60">
                                        <input 
                                            type="text" 
                                            value={searchKeyword}
                                            onChange={(e) => setSearchKeyword(e.target.value)}
                                            placeholder="Search titles..." 
                                            className="w-full bg-slate-900 border border-slate-800 rounded-lg sm:rounded-xl pl-8 pr-3 py-1.5 sm:py-2 text-[11px] sm:text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                                        />
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-3.5 w-3.5 text-slate-500 absolute left-2.5 top-2 sm:top-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 sm:py-8 flex-1 w-full">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                            {filteredGames.map(game => (
                                <GameCard key={game.id} game={game} entryData={trackerState[game.id]} onUpdate={handleUpdate} />
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
